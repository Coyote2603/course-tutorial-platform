name: Feature request
description: Suggest a broadly useful teaching or platform improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the teaching need before proposing an implementation. Keep all examples synthetic and safe for public discussion.
  - type: textarea
    id: teaching-need
    attributes:
      label: Teaching need
      description: What should an instructor or learner be able to do that is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and where it would appear.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Could the existing content model, hints, slides, or LMS links address the need?
  - type: dropdown
    id: data-impact
    attributes:
      label: Does this require collecting or storing learner data?
      options:
        - "No"
        - "Unsure"
        - "Yes"
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility considerations
      description: Note keyboard, screen-reader, contrast, motion, or cognitive-load implications.
  - type: checkboxes
    id: public-safe
    attributes:
      label: Public-content confirmation
      options:
        - label: All examples in this request are synthetic or cleared for public release.
          required: true
